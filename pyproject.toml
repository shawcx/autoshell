[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "autoshell"
version = "0.1.0"
description = "Build interactive command shells from decorated Python functions"
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["autoshell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
